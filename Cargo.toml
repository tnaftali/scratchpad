[package]
name = "scratchpad"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-component = { version = "0.8.1", features = ["tree-sitter-markdown"] }
gpui = { package = "gpui-pre", version = "0.3.10" }
gpui-base = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui_platform = { package = "gpui-pre-platform", version = "0.3", features = ["wayland", "x11"] }
pulldown-cmark = { version = "0.13.6", default-features = false }

# runtime_shaders: compile Metal shaders at startup, so the build needs no Xcode Metal Toolchain.
# font-kit: without it gpui_macos renders no text at all.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "0.3", features = ["runtime_shaders", "font-kit"] }
global-hotkey = "0.10"
objc2 = "0.6"
raw-window-handle = "0.6"
